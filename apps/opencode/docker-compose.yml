services:
  opencode:
    image: 'ghcr.io/anomalyco/opencode:1.18.25'
    command:
      - 'serve'
      - '--hostname'
      - '0.0.0.0'
    working_dir: '/workspace'
    volumes:
      - '${APP_DATA_DIR}/data/home:/home/opencode'
      - '${APP_DATA_DIR}/data/workspace:/workspace'
    environment:
      - 'HOME=/home/opencode'
      - 'OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME}'
      - 'OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}'
    healthcheck:
      test: 'wget -qO- http://localhost:4096/global/health || exit 1'
      interval: '30s'
      timeout: '10s'
      retries: 3
    x-runtipi:
      internal_port: 4096
      is_main: true

x-runtipi:
  schema_version: 2